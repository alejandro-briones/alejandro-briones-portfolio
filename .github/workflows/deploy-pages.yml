name: Deploy Blazor WebAssembly to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PROJECT_PATH: AlejandroBriones.Portfolio/AlejandroBriones.Portfolio.csproj
  PUBLISH_DIR: AlejandroBriones.Portfolio/bin/Release/net10.0/publish/wwwroot

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Restore dependencies
        run: dotnet restore $PROJECT_PATH

      - name: Publish application
        run: dotnet publish $PROJECT_PATH -c Release --no-restore

      - name: Disable Jekyll processing
        shell: bash
        run: touch "$PUBLISH_DIR/.nojekyll"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4